<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./assets/img/cloud-question-outline.svg">
    <title>What Was It?</title>
  </head>
    
    <div id="weather-holder"></div>
      <div id="content-holder">
        <div id="intro">
          <div id="logo-section">
              <span class="w">W</span>
              <span class="h">H</span>
              <span class="a">A</span>
              <span class="t">T</span>
            <img id="logo" src="./assets/img/cloud-question-outline.svg">
            <div class="logo-text">WAS IT?</div>
          </div>
          <div id="intro-text">
            <!-- add some short nice intro text -->
          </div>
        </div>

        <div class="address-field-with-label main-part">
          <label id="city" for="address-search" class="sr-only">Search for your address</label>
        </div>

        <label for="temp-switch">Select desired temperature scale</label>
        <input type="checkbox" name="temp-switch" id="temp-switch" role="switch">

        <div id="temp-holder">
          <div class="temp" id="temp-box"></div>
        </div>

        <div id="outro-text">
            <p>The aim of this website is simple: to keep you prepared for your
            office small talk.</p>
            <p>In order to survive it, you gotta appear normal and sociable enough.</p>
            <p>And is there really a better way to do so than by complaining about
            yesterday's weather?</p>
        </div>
      </div>
  </body>
</html>
