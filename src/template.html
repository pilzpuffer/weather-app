<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./assets/img/cloud-question-outline.svg">
    <title>What Was It?</title>
  </head>
  <body>
    <div id="content-holder">
      <form novalidate>
        <!-- <label for="city">Enter your city</label> -->
        <div id="search-nav">
          <input type="search" id="city" required minlength="4" autocomplete="address-level2"/>
          <button id="searchSend" type="submit">Search</button>
        </div>
        <span class="error" aria-live="polite"></span>
        
        
      </form>

      <label for="temp-switch">Select desired temperature scale</label>
      <input type="checkbox" name="temp-switch" id="temp-switch" role="switch">

      <div id="temp-holder">
        <div class="temp" id="temp-box"></div>
      </div>
    </div>
  </body>
</html>
